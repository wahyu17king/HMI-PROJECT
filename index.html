<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUILDING CONTROL SYSTEM</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ════════ LOGIN ════════ -->
<div id="login">
  <div style="text-align:center;">
    <div class="logo-mark">HMI</div>
    <div class="logo-sub">Building Control System</div>
  </div>
  <div style="display:flex; flex-direction:column; gap:12px;">
    <button class="login-btn" onclick="loginAs('housekeeping')">
      <span>Housekeeping</span><span class="arrow">→</span>
    </button>
    <button class="login-btn" onclick="loginAs('engineer')">
      <span>Engineer</span><span class="arrow">→</span>
    </button>
    <button class="login-btn" onclick="loginAs('admin')">
      <span>Admin</span><span class="arrow">→</span>
    </button>
  </div>
</div>

<!-- ════════ APP ════════ -->
<div id="app">
  <header>
    <div class="brand">
      <span class="brand-name">HMI</span>
      <span class="brand-divider"></span>
      <span class="brand-sub">Building Control</span>
    </div>
    <div class="header-right">
      <span id="roleBadge" class="role-badge"></span>
      <button id="logoutBtn" onclick="logout()">Logout</button>
    </div>
  </header>
  
  <div class="stats" id="stats"></div>

  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">Floor</span>
      <select class="filter-select" id="filterFloor" onchange="applyFilters()">
        <option value="ALL">All Floors</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Room Type</span>
      <select class="filter-select" id="filterType" onchange="applyFilters()">
        <option value="ALL">All Types</option>
        <option value="STANDARD">Standard</option>
        <option value="DELUXE">Deluxe</option>
        <option value="SUITE">Suite</option>
        <option value="PRESIDENTIAL">Presidential</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Status</span>
      <select class="filter-select" id="filterStatus" onchange="applyFilters()">
        <option value="ALL">All Status</option>
        <option value="OCCUPIED">Occupied</option>
        <option value="VACANT">Vacant</option>
        <option value="DND">DND Active</option>
        <option value="MUR">MUR Active</option>
        <option value="CLEAN">Needs Cleaning</option>
      </select>
    </div>
    <div class="filter-group" style="flex:1; min-width:200px;">
      <span class="filter-label">Search</span>
      <input type="text" class="filter-input" id="filterSearch" placeholder="Room No. or Guest Name" oninput="applyFilters()">
    </div>
    <div class="result-count" id="resultCount">Showing <span>480</span> of 480 Rooms</div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<!-- ════════ MODAL ════════ -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modalTitle">Check-In</h3>
    <div id="modalBody"></div>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-checkin" id="modalOk">Confirm</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUILDING CONTROL SYSTEM</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ════════ LOGIN ════════ -->
<div id="login">
  <div style="text-align:center;">
    <div class="logo-mark">HMI</div>
    <div class="logo-sub">Building Control System</div>
  </div>
  <form id="loginForm" class="login-form">
    <div class="login-field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
    </div>
    <div class="login-field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>
    <p class="login-security-note">Mode demo: login dan hak akses berjalan di browser, bukan autentikasi server.</p>
    <button class="login-btn" type="submit">
      <span>Sign In</span><span class="arrow" aria-hidden="true">→</span>
    </button>
  </form>
</div>

<!-- ════════ APP ════════ -->
<div id="app">
  <header>
    <div class="brand">
      <span class="brand-name">HMI</span>
      <span class="brand-divider"></span>
      <span class="brand-sub">Building Control</span>
    </div>
    <div class="header-right">
      <span id="roleBadge" class="role-badge"></span>
      <button id="alarmCenterBtn" class="btn btn-alarm" onclick="openAlarmCenter()">Alarms <span id="alarmCount" class="alarm-count">0</span></button>
      <button id="simulateLinkBtn" class="btn btn-cancel" onclick="simulateLinkDrop()">Demo Link Drop</button>
      <button id="trendBtn" class="btn" onclick="openTrendExplorer()">Trends</button>
      <button id="historyBtn" class="btn" onclick="openCommandHistory()">Command History</button>
      <button id="handoverBtn" class="btn" onclick="openShiftHandover()">Shift Notes</button>
      <button id="diagnosticsBtn" class="btn" onclick="openDiagnostics()">Diagnostics</button>
      <button id="exportBtn" class="btn" onclick="exportRoomCsv()">Export CSV</button>
      <button id="auditLogBtn" class="btn" onclick="openAuditLog()">Security Log</button>
      <button id="addRoomBtn" class="btn btn-add-room" onclick="openRoomEditor()">Add Room</button>
      <button id="logoutBtn" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="simulation-note">SIMULATED TELEMETRY · NOT CONNECTED TO KNX</div>
  
  <div class="stats" id="stats"></div>

  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">Floor</span>
      <select class="filter-select" id="filterFloor" onchange="applyFilters()">
        <option value="ALL">All Floors</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Room Type</span>
      <select class="filter-select" id="filterType" onchange="applyFilters()">
        <option value="ALL">All Types</option>
        <option value="STANDARD">Standard</option>
        <option value="DELUXE">Deluxe</option>
        <option value="SUITE">Suite</option>
        <option value="PRESIDENTIAL">Presidential</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Status</span>
      <select class="filter-select" id="filterStatus" onchange="applyFilters()">
        <option value="ALL">All Status</option>
        <option value="OCCUPIED">Occupied</option>
        <option value="VACANT">Vacant</option>
        <option value="DND">DND Active</option>
        <option value="MUR">MUR Active</option>
        <option value="CLEAN">Needs Cleaning</option>
        <option value="OFFLINE">Controller Offline</option>
      </select>
    </div>
    <div class="filter-group" style="flex:1; min-width:200px;">
      <span class="filter-label">Search</span>
      <input type="text" class="filter-input" id="filterSearch" placeholder="Room No. or Guest Name" oninput="applyFilters()">
    </div>
    <div class="result-count" id="resultCount">Showing <span>480</span> of 480 Rooms</div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<!-- ════════ MODAL ════════ -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modalTitle">Check-In</h3>
    <div id="modalBody"></div>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-checkin" id="modalOk">Confirm</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
<script src="js/features.js"></script>
</body>
</html>
